<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Break</title>
<style>
  :root {
    --bg: #FBF6EF; --surface: #FFFFFF; --surface-2: #F4ECE1; --ink: #2A1E17; --ink-2: #6B5A4E; --ink-3: #9A887A;
    --line: #E7DCCD; --accent: #B5652B; --accent-ink: #8A4A1C; --accent-soft: #F6E3D2;
    --act-bg: #FBE3DC; --act-ink: #9A2F1A;
    --change-bg: #DFF1E4; --change-ink: #1F6B3A;
    --consider-bg: #FCEFD2; --consider-ink: #7A5000;
    --reassure-bg: #DCEEF2; --reassure-ink: #1D5F6E;
    --know-bg: #EDE7DF; --know-ink: #5A4B40;
    --shadow: 0 1px 2px rgba(60,40,25,.06), 0 4px 14px rgba(60,40,25,.06);
    --serif: "Noto Serif", Georgia, "Times New Roman", serif;
    --sans: Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body.dark {
    --bg: #1C1512; --surface: #261D18; --surface-2: #2F241E; --ink: #F3E9DF; --ink-2: #C3B2A3; --ink-3: #8F7E71;
    --line: #3A2D25; --accent: #E9A66B; --accent-ink: #F2BE8C; --accent-soft: #3A2A1F;
    --act-bg: #4A2219; --act-ink: #FFB4A1;
    --change-bg: #1E3A28; --change-ink: #9EE0B2;
    --consider-bg: #45341A; --consider-ink: #F5CD7A;
    --reassure-bg: #1B3940; --reassure-ink: #9BD7E4;
    --know-bg: #342A23; --know-ink: #D8C8B8;
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: var(--accent-ink); }

  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 10px; border-bottom: 1px solid transparent; transition: border-color .2s;
  }
  .topbar.scrolled { border-bottom-color: var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 28px; height: 28px; flex: none; }
  .brand-name { font-family: var(--serif); font-weight: 700; font-size: 19px; letter-spacing: .2px; }
  .brand-sub { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-3); margin-top: -2px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--ink-2); }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }
  .spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 4px 16px 108px; max-width: 720px; margin: 0 auto; }

  .kicker { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; margin-top: 8px; }
  h1.issue-title { font-family: var(--serif); font-size: 30px; line-height: 1.15; margin: 6px 0 8px; font-weight: 700; letter-spacing: -0.2px; }
  .issue-meta { color: var(--ink-2); font-size: 14px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .dot-sep::before { content: "·"; margin: 0 2px; color: var(--ink-3); }
  .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 14px; padding: 8px 0; min-height: 44px; }
  .back-link svg { width: 18px; height: 18px; }

  .tldr { background: var(--accent-soft); border-radius: 16px; padding: 16px 16px 6px; margin: 18px 0 8px; }
  .tldr h2 { font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 8px; }
  .tldr ol { margin: 0; padding: 0; list-style: none; counter-reset: t; }
  .tldr li { counter-increment: t; position: relative; padding: 0 0 12px 34px; font-size: 15.5px; }
  .tldr li::before {
    content: counter(t); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 12px;
    background: var(--accent); color: var(--bg); font-size: 13px; font-weight: 700; display: grid; place-items: center;
  }

  h2.section { font-family: var(--serif); font-size: 21px; margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2.section .count { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--ink-3); background: var(--surface-2); border-radius: 10px; padding: 1px 8px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 12px; box-shadow: var(--shadow); scroll-margin-top: 72px; }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { font-size: 12px; font-weight: 600; border-radius: 8px; padding: 2px 8px; line-height: 1.6; }
  .chip.tag { background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
  .v-act { background: var(--act-bg); color: var(--act-ink); }
  .v-change { background: var(--change-bg); color: var(--change-ink); }
  .v-consider { background: var(--consider-bg); color: var(--consider-ink); }
  .v-reassure { background: var(--reassure-bg); color: var(--reassure-ink); }
  .v-know { background: var(--know-bg); color: var(--know-ink); }
  .card h3 { font-family: var(--serif); font-size: 18.5px; line-height: 1.3; margin: 0 0 4px; font-weight: 700; }
  .src { font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
  .finding { margin: 0 0 12px; font-size: 15.5px; }
  .sowhat { border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 10px 10px 0; padding: 10px 12px; font-size: 15px; }
  .sowhat b { display: block; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 2px; }
  .more-toggle { margin-top: 10px; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; min-height: 36px; }
  .more-toggle svg { width: 16px; height: 16px; transition: transform .2s; }
  .more-toggle.open svg { transform: rotate(180deg); }
  .more { font-size: 14.5px; color: var(--ink-2); padding: 2px 0 4px; }
  .more p { margin: 6px 0; }
  .more b { color: var(--ink); font-weight: 600; }
  .actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .act-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 8px 10px; border-radius: 10px; min-height: 40px; }
  .act-btn:active { background: var(--surface-2); }
  .act-btn svg { width: 18px; height: 18px; }
  .act-btn.primary { color: var(--accent-ink); }
  .act-btn.saved { color: var(--accent-ink); }
  .act-btn.saved svg { fill: currentColor; }

  .hits { list-style: none; margin: 0; padding: 0; }
  .hits li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .hits p { margin: 0 0 4px; font-size: 15px; }
  .hits button { font-size: 13px; color: var(--accent-ink); font-weight: 600; min-height: 32px; }

  .dates { list-style: none; margin: 0; padding: 0; }
  .dates li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .dates li:last-child { border-bottom: 0; }
  .dbadge { flex: none; width: 48px; text-align: center; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 4px 0; }
  .dbadge .d { font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1.1; }
  .dbadge .m { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-3); }
  .dates .lbl { font-size: 15px; }
  .dates li.past { opacity: .5; }

  .coverage { font-size: 13px; color: var(--ink-3); margin: 26px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); }

  .search { position: relative; margin: 12px 0 16px; }
  .search input {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 12px 42px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 13px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--ink-3); }
  .list-card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .list-card:active { background: var(--surface-2); }
  .list-card .k { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .list-card .t { font-family: var(--serif); font-size: 17.5px; font-weight: 700; margin: 2px 0 4px; line-height: 1.3; }
  .list-card .s { font-size: 14px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .unread { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .page-title { font-family: var(--serif); font-size: 26px; margin: 10px 0 2px; }
  .page-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 8px; }
  .empty { text-align: center; color: var(--ink-2); padding: 48px 12px; }
  .empty svg { width: 44px; height: 44px; color: var(--ink-3); margin-bottom: 8px; }
  mark { background: var(--consider-bg); color: inherit; border-radius: 3px; padding: 0 1px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
  .panel h3 { margin: 0 0 8px; font-size: 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row:last-of-type { border-bottom: 0; }
  .row span:first-child { color: var(--ink-2); }
  .row span:last-child { text-align: right; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 15px; background: var(--accent); color: var(--bg); margin-top: 10px; }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }
  .ok { color: var(--change-ink); } .warn { color: var(--act-ink); }
  .banner { background: var(--consider-bg); color: var(--consider-ink); border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: 14.5px; }
  .banner button { font-weight: 700; text-decoration: underline; color: inherit; }
  .prose { font-size: 15px; color: var(--ink-2); }
  .prose p { margin: 8px 0; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface);
    border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--ink-3); padding: 4px 0; min-height: 52px; justify-content: center; }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button .pill { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .2s; }
  nav.tabs button.on { color: var(--ink); font-weight: 600; }
  nav.tabs button.on .pill { background: var(--accent-soft); color: var(--accent-ink); }

  #toast {
    position: fixed; left: 50%; bottom: 88px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
    transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); z-index: 10; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="brand">
    <svg viewBox="0 0 108 108" aria-hidden="true">
      <rect width="108" height="108" rx="30" fill="#3B2A20"/>
      <path d="M31,47 H38 L40.5,36 L49,34.5 L51,47 H57 L59.5,36 L68,34.5 L70,47 H77" stroke="#F2B544" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36,54 H70 V62 C70,71.5 62.4,78 53,78 C43.6,78 36,71.5 36,62 Z" fill="#F4E6D4"/>
      <path d="M70,57.5 C76.5,57.5 79,60.5 79,64 C79,67.8 76,70.5 69,70.5" stroke="#F4E6D4" stroke-width="4.4" fill="none" stroke-linecap="round"/>
      <path d="M31,82.5 H75" stroke="#F4E6D4" stroke-width="4.4" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="brand-name">Coffee Break</div>
      <div class="brand-sub">Anaesthesia weekly</div>
    </div>
  </div>
  <button class="icon-btn" id="refreshBtn" aria-label="Check for a new issue">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v4a6 6 0 0 1-12 0z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H15.5"/><path d="M3 21h14"/><path d="M8 3.5c-.8 1 .8 2 0 3M12 3.5c-.8 1 .8 2 0 3"/></svg></span>This week</button>
  <button data-tab="archive"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg></span>Archive</button>
  <button data-tab="saved"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span>Saved</button>
  <button data-tab="about"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></svg></span>About</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------- Native bridge (with a browser fallback for previewing) ----------
  var N = window.Native || {
    getArchive: function () { return window.__SEED__ ? JSON.stringify(window.__SEED__) : '{"issues":[]}'; },
    refresh: function () { setTimeout(function () { window.onSynced({ ok: true, newIssues: [] }); }, 400); },
    getState: function () { try { return localStorage.getItem("cb_state") || "{}"; } catch (e) { return "{}"; } },
    setState: function (s) { try { localStorage.setItem("cb_state", s); } catch (e) {} },
    openUrl: function (u) { window.open(u, "_blank"); },
    share: function (s, t) { if (navigator.share) navigator.share({ title: s, text: t }); },
    isDark: function () { return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; },
    info: function () { return JSON.stringify({ versionName: "preview", versionCode: 1, lastCheck: 0, notificationsOn: true, feedUrl: "", repoUrl: "" }); },
    openNotificationSettings: function () {}
  };

  var archive = { issues: [] };
  var ui = { saved: {}, read: {}, open: {} };
  var route = { tab: "home", issueId: null, query: "" };
  var manualRefresh = false;
  var lastAutoRefresh = 0;

  var VERDICTS = {
    act: "Action needed",
    change: "Could change practice",
    consider: "Worth considering",
    reassure: "Supports current practice",
    know: "Good to know"
  };
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // ---------- helpers ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!attrs.hasOwnProperty(k) || attrs[k] == null || attrs[k] === false) continue;
        if (k === "class") el.className = attrs[k];
        else if (k === "text") el.textContent = attrs[k];
        else if (k === "html") el.innerHTML = attrs[k]; // only ever used with static strings
        else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), attrs[k]);
        else el.setAttribute(k, attrs[k]);
      }
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) el.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
      else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function svg(path) { return h("span", { html: path, style: "display:inline-flex" }); }
  var ICONS = {
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    cup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v4a6 6 0 0 1-12 0z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H15.5"/><path d="M3 21h14"/></svg>'
  };

  function parseDate(s) {
    if (!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function fmtShort(s) { var d = parseDate(s); return d ? d.getDate() + " " + MONTHS[d.getMonth()] : ""; }
  function fmtLong(s) { var d = parseDate(s); return d ? DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear() : ""; }
  function fmtRange(w) {
    if (!w) return "";
    var a = parseDate(w.from), b = parseDate(w.to);
    if (!a || !b) return "";
    if (a.getMonth() === b.getMonth()) return a.getDate() + "–" + b.getDate() + " " + MONTHS[b.getMonth()] + " " + b.getFullYear();
    return a.getDate() + " " + MONTHS[a.getMonth()] + " – " + b.getDate() + " " + MONTHS[b.getMonth()] + " " + b.getFullYear();
  }
  function ago(ms) {
    if (!ms) return "never";
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }
  function saveUi() { N.setState(JSON.stringify(ui)); }
  function key(issueId, itemId) { return issueId + "/" + itemId; }
  function issueById(id) { for (var i = 0; i < archive.issues.length; i++) if (archive.issues[i].id === id) return archive.issues[i]; return null; }
  function latest() { return archive.issues[0] || null; }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  function loadArchive() {
    try { archive = JSON.parse(N.getArchive()) || { issues: [] }; } catch (e) { archive = { issues: [] }; }
    if (!Array.isArray(archive.issues)) archive.issues = [];
  }

  // ---------- rendering: issue ----------
  function renderItem(issue, item) {
    var k = key(issue.id, item.id);
    var isSaved = !!ui.saved[k];
    var isOpen = !!ui.open[k];
    var chips = h("div", { class: "chips" },
      item.verdict && VERDICTS[item.verdict] ? h("span", { class: "chip v-" + item.verdict, text: VERDICTS[item.verdict] }) : null,
      (item.tags || []).map(function (t) { return h("span", { class: "chip tag", text: t }); })
    );
    var srcLine = [item.source, fmtShort(item.date)].filter(Boolean).join(" · ") + (item.dateNote ? " (" + item.dateNote + ")" : "");
    var hasMore = item.design || item.trust;
    var more = hasMore ? h("div", { class: "more", style: isOpen ? "" : "display:none" },
      item.design ? h("p", null, h("b", { text: "Design  " }), item.design) : null,
      item.trust ? h("p", null, h("b", { text: "How much to trust it  " }), item.trust) : null
    ) : null;
    var toggle = hasMore ? h("button", {
      class: "more-toggle" + (isOpen ? " open" : ""),
      onclick: function () {
        ui.open[k] = !ui.open[k]; saveUi();
        more.style.display = ui.open[k] ? "" : "none";
        toggle.classList.toggle("open", !!ui.open[k]);
        toggle.firstChild.textContent = ui.open[k] ? "Hide design & trust" : "Design & how much to trust it";
      }
    }, h("span", { text: isOpen ? "Hide design & trust" : "Design & how much to trust it" }), svg(ICONS.chevron)) : null;

    var saveBtn = h("button", {
      class: "act-btn" + (isSaved ? " saved" : ""),
      "aria-label": isSaved ? "Remove from saved" : "Save",
      onclick: function () {
        if (ui.saved[k]) { delete ui.saved[k]; saveBtn.classList.remove("saved"); saveBtn.lastChild.textContent = "Save"; toast("Removed from Saved"); }
        else { ui.saved[k] = { issueId: issue.id, itemId: item.id, at: Date.now() }; saveBtn.classList.add("saved"); saveBtn.lastChild.textContent = "Saved"; toast("Saved"); }
        saveUi();
      }
    }, svg(ICONS.save), h("span", { text: isSaved ? "Saved" : "Save" }));

    return h("article", { class: "card", id: "item-" + k.replace(/[^a-zA-Z0-9-]/g, "_") },
      chips,
      h("h3", { text: item.title }),
      h("div", { class: "src", text: srcLine }),
      item.finding ? h("p", { class: "finding", text: item.finding }) : null,
      item.soWhat ? h("div", { class: "sowhat" }, h("b", { text: "So what" }), item.soWhat) : null,
      toggle, more,
      h("div", { class: "actions" },
        item.url ? h("button", { class: "act-btn primary", onclick: function () { N.openUrl(item.url); } }, svg(ICONS.link), h("span", { text: "Read" })) : null,
        saveBtn,
        h("button", {
          class: "act-btn", onclick: function () {
            N.share(item.title, item.title + "\n\n" + (item.soWhat || "") + (item.url ? "\n\n" + item.url : "") + "\n\nvia Coffee Break · Anaesthesia");
          }
        }, svg(ICONS.share), h("span", { text: "Share" }))
      )
    );
  }

  function renderIssue(issue, withBack) {
    var v = document.getElementById("view");
    v.innerHTML = "";
    if (!issue) {
      v.appendChild(h("div", { class: "empty" }, svg(ICONS.cup), h("p", { text: "No issues yet. Tap refresh to check for this week's." })));
      return;
    }
    ui.read[issue.id] = true; saveUi();
    var nItems = 0;
    (issue.sections || []).forEach(function (s) { nItems += (s.items || []).length; });

    if (withBack) v.appendChild(h("button", { class: "back-link", onclick: function () { go("archive"); } }, svg(ICONS.back), "Archive"));
    if (archive.app && route.tab === "home" && updateAvailable()) {
      v.appendChild(h("div", { class: "banner" }, "A new version of the app is available. ",
        h("button", { onclick: function () { N.openUrl(archive.app.apkUrl); } , text: "Download" })));
    }
    v.appendChild(h("div", { class: "kicker", text: "Issue " + (issue.number || "") + " · " + fmtRange(issue.window) }));
    v.appendChild(h("h1", { class: "issue-title", text: issue.title || "This week" }));
    v.appendChild(h("div", { class: "issue-meta" },
      h("span", { text: "≈" + (issue.readMinutes || 10) + " min read" }),
      h("span", { class: "dot-sep" }),
      h("span", { text: nItems + " stories" }),
      h("span", { class: "dot-sep" }),
      h("span", { text: fmtLong(issue.published || issue.id) })
    ));

    if (issue.tldr && issue.tldr.length) {
      v.appendChild(h("section", { class: "tldr" },
        h("h2", { text: "If you read nothing else" }),
        h("ol", null, issue.tldr.map(function (t) { return h("li", { text: t }); }))
      ));
    }

    (issue.sections || []).forEach(function (s) {
      if (!s.items || !s.items.length) return;
      v.appendChild(h("h2", { class: "section" }, s.title, h("span", { class: "count", text: String(s.items.length) })));
      s.items.forEach(function (it) { v.appendChild(renderItem(issue, it)); });
    });

    if (issue.quickHits && issue.quickHits.length) {
      v.appendChild(h("h2", { class: "section" }, "Quick hits", h("span", { class: "count", text: String(issue.quickHits.length) })));
      v.appendChild(h("ul", { class: "hits" }, issue.quickHits.map(function (q) {
        return h("li", null,
          h("p", { text: q.text }),
          h("button", { onclick: function () { if (q.url) N.openUrl(q.url); } },
            [q.source, fmtShort(q.date)].filter(Boolean).join(" · ") + (q.url ? " ↗" : ""))
        );
      })));
    }

    if (issue.dates && issue.dates.length) {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      v.appendChild(h("h2", { class: "section", text: "Dates ahead" }));
      v.appendChild(h("ul", { class: "dates" }, issue.dates.map(function (d) {
        var dt = parseDate(d.date);
        return h("li", { class: dt && dt < today ? "past" : "" },
          h("div", { class: "dbadge" }, h("div", { class: "d", text: dt ? String(dt.getDate()) : "?" }), h("div", { class: "m", text: dt ? MONTHS[dt.getMonth()] : "" })),
          h("div", { class: "lbl", text: d.label })
        );
      })));
    }

    if (issue.coverage) v.appendChild(h("p", { class: "coverage", text: "About this issue: " + issue.coverage }));
  }

  // ---------- rendering: archive + search ----------
  function allEntries() {
    var out = [];
    archive.issues.forEach(function (is) {
      (is.sections || []).forEach(function (s) {
        (s.items || []).forEach(function (it) {
          out.push({ issue: is, item: it, text: [it.title, it.finding, it.soWhat, it.trust, it.design, it.source, (it.tags || []).join(" ")].join(" ").toLowerCase() });
        });
      });
      (is.quickHits || []).forEach(function (q, i) {
        out.push({ issue: is, hit: q, text: [q.text, q.source].join(" ").toLowerCase() });
      });
    });
    return out;
  }

  function highlight(text, q) {
    var frag = document.createDocumentFragment();
    if (!q) { frag.appendChild(document.createTextNode(text)); return frag; }
    var lower = text.toLowerCase(), i = 0, at;
    while ((at = lower.indexOf(q, i)) >= 0) {
      frag.appendChild(document.createTextNode(text.slice(i, at)));
      frag.appendChild(h("mark", { text: text.slice(at, at + q.length) }));
      i = at + q.length;
    }
    frag.appendChild(document.createTextNode(text.slice(i)));
    return frag;
  }

  function renderArchive() {
    var v = document.getElementById("view");
    v.innerHTML = "";
    v.appendChild(h("h1", { class: "page-title", text: "Archive" }));
    v.appendChild(h("p", { class: "page-sub", text: archive.issues.length + (archive.issues.length === 1 ? " issue" : " issues") + ", kept on your phone" }));
    var input = h("input", { type: "search", placeholder: "Search every issue (e.g. sugammadex, airway)", value: route.query || "", "aria-label": "Search" });
    v.appendChild(h("div", { class: "search" }, svg(ICONS.search), input));
    var results = h("div");
    v.appendChild(results);

    function draw() {
      var q = (input.value || "").trim().toLowerCase();
      route.query = q;
      results.innerHTML = "";
      if (!q) {
        if (!archive.issues.length) { results.appendChild(h("div", { class: "empty", text: "Nothing here yet." })); return; }
        archive.issues.forEach(function (is) {
          results.appendChild(h("button", { class: "list-card", onclick: function () { openIssue(is.id); } },
            h("div", { class: "k" }, !ui.read[is.id] ? h("span", { class: "unread", "aria-label": "Unread" }) : null, "Issue " + (is.number || "") + " · " + fmtRange(is.window)),
            h("div", { class: "t", text: is.title || "" }),
            is.tldr && is.tldr[0] ? h("div", { class: "s", text: is.tldr[0] }) : null
          ));
        });
        return;
      }
      var hits = allEntries().filter(function (e) { return e.text.indexOf(q) >= 0; });
      if (!hits.length) { results.appendChild(h("div", { class: "empty", text: "No matches for “" + q + "”." })); return; }
      results.appendChild(h("p", { class: "page-sub", text: hits.length + (hits.length === 1 ? " match" : " matches") }));
      hits.slice(0, 80).forEach(function (e) {
        var title = e.item ? e.item.title : e.hit.text;
        var sub = e.item ? (e.item.soWhat || e.item.finding || "") : "";
        results.appendChild(h("button", {
          class: "list-card", onclick: function () {
            if (e.item) openIssue(e.issue.id, e.item.id); else if (e.hit.url) N.openUrl(e.hit.url);
          }
        },
          h("div", { class: "k", text: "Issue " + (e.issue.number || "") + " · " + (e.item ? e.item.source : e.hit.source) + (e.item ? "" : " · quick hit") }),
          h("div", { class: "t" }, highlight(title, q)),
          sub ? h("div", { class: "s" }, highlight(sub, q)) : null
        ));
      });
    }
    var debounce;
    input.addEventListener("input", function () { clearTimeout(debounce); debounce = setTimeout(draw, 120); });
    draw();
  }

  // ---------- rendering: saved ----------
  function renderSaved() {
    var v = document.getElementById("view");
    v.innerHTML = "";
    v.appendChild(h("h1", { class: "page-title", text: "Saved" }));
    var keys = Object.keys(ui.saved).sort(function (a, b) { return (ui.saved[b].at || 0) - (ui.saved[a].at || 0); });
    var rows = [];
    keys.forEach(function (k) {
      var s = ui.saved[k], is = issueById(s.issueId), it = null;
      if (is) (is.sections || []).forEach(function (sec) { (sec.items || []).forEach(function (x) { if (x.id === s.itemId) it = x; }); });
      if (is && it) rows.push({ issue: is, item: it });
    });
    if (!rows.length) {
      v.appendChild(h("div", { class: "empty" }, svg(ICONS.save), h("p", { text: "Tap Save on any story to keep it here, for journal club, teaching or later reading." })));
      return;
    }
    v.appendChild(h("p", { class: "page-sub", text: rows.length + (rows.length === 1 ? " story" : " stories") }));
    rows.forEach(function (r) {
      v.appendChild(h("button", { class: "list-card", onclick: function () { openIssue(r.issue.id, r.item.id); } },
        h("div", { class: "k", text: [r.item.source, fmtShort(r.item.date), "Issue " + (r.issue.number || "")].filter(Boolean).join(" · ") }),
        h("div", { class: "t", text: r.item.title }),
        h("div", { class: "s", text: r.item.soWhat || r.item.finding || "" })
      ));
    });
  }

  // ---------- rendering: about ----------
  function updateAvailable() {
    try {
      var info = JSON.parse(N.info());
      return archive.app && archive.app.latestVersion && info.versionCode && archive.app.latestVersion > info.versionCode && archive.app.apkUrl;
    } catch (e) { return false; }
  }

  function renderAbout() {
    var v = document.getElementById("view");
    v.innerHTML = "";
    var info = {};
    try { info = JSON.parse(N.info()); } catch (e) {}
    var l = latest();
    v.appendChild(h("h1", { class: "page-title", text: "About" }));
    if (updateAvailable()) {
      v.appendChild(h("div", { class: "banner" }, "Version " + archive.app.latestVersion + " of the app is available. ",
        h("button", { onclick: function () { N.openUrl(archive.app.apkUrl); }, text: "Download" })));
    }
    var status = h("div", { class: "panel" },
      h("h3", { text: "Status" }),
      h("div", { class: "row" }, h("span", { text: "Latest issue" }), h("span", { text: l ? "#" + (l.number || "") + " · " + fmtShort(l.published || l.id) : "none" })),
      h("div", { class: "row" }, h("span", { text: "Last checked" }), h("span", { text: ago(info.lastCheck) })),
      info.lastError ? h("div", { class: "row" }, h("span", { text: "Last problem" }), h("span", { class: "warn", text: info.lastError })) : null,
      h("div", { class: "row" }, h("span", { text: "Notifications" }),
        h("span", { class: info.notificationsOn ? "ok" : "warn", text: info.notificationsOn ? "On" : "Off" })),
      h("div", null,
        h("button", { class: "btn", onclick: function () { doRefresh(true); } }, "Check for a new issue"), " ",
        h("button", { class: "btn ghost", onclick: function () { N.openNotificationSettings(); } }, "Notification settings"))
    );
    v.appendChild(status);
    v.appendChild(h("div", { class: "panel prose" },
      h("h3", { text: "How it works" }),
      h("p", { text: "A new issue is written every Monday morning (Perth time), covering the previous seven days of anaesthesia journals, anaesthesia-relevant trials in the big general journals, and guideline, safety and supply news." }),
      h("p", { text: "The app checks for it every few hours and notifies you when it lands. Every issue stays on your phone, so the archive and search work offline." }),
      h("p", { text: "Summaries are machine-written from abstracts and public pages, so check the paper before changing practice." }),
      info.repoUrl ? h("p", null, h("button", { class: "btn ghost", onclick: function () { N.openUrl(info.repoUrl); } }, "View the feed on GitHub")) : null
    ));
    v.appendChild(h("p", { class: "coverage", text: "Coffee Break · version " + (info.versionName || "?") }));
  }

  // ---------- navigation ----------
  function setTabs() {
    var btns = document.querySelectorAll("nav.tabs button");
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("on", btns[i].getAttribute("data-tab") === route.tab);
  }
  function render() {
    setTabs();
    if (route.tab === "home") renderIssue(latest(), false);
    else if (route.tab === "archive") { if (route.issueId) renderIssue(issueById(route.issueId), true); else renderArchive(); }
    else if (route.tab === "saved") renderSaved();
    else renderAbout();
  }
  function go(tab) {
    route.tab = tab; route.issueId = null;
    render(); window.scrollTo(0, 0);
  }
  function openIssue(id, itemId) {
    var l = latest();
    if (l && l.id === id) { route.tab = "home"; route.issueId = null; }
    else { route.tab = "archive"; route.issueId = id; }
    render();
    if (itemId) {
      var el = document.getElementById("item-" + key(id, itemId).replace(/[^a-zA-Z0-9-]/g, "_"));
      if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("flash"); }
    } else window.scrollTo(0, 0);
  }
  window.openIssue = openIssue;
  window.handleBack = function () {
    if (route.tab === "archive" && route.issueId) { go("archive"); return true; }
    if (route.tab !== "home") { go("home"); return true; }
    return false;
  };

  // ---------- sync ----------
  function doRefresh(manual) {
    manualRefresh = manualRefresh || manual;
    document.getElementById("refreshBtn").classList.add("spin");
    lastAutoRefresh = Date.now();
    N.refresh();
  }
  window.onSynced = function (r) {
    document.getElementById("refreshBtn").classList.remove("spin");
    var before = latest() ? latest().id : "";
    loadArchive();
    var after = latest() ? latest().id : "";
    if (r && r.ok) {
      if (after && after !== before) {
        toast("New issue: #" + (latest().number || "") + " " + (latest().title || ""));
        if (route.tab === "home") { render(); window.scrollTo(0, 0); }
        else render();
      } else {
        if (manualRefresh) toast("You're up to date");
        if (route.tab === "about") renderAbout();
      }
    } else if (manualRefresh) {
      toast("Couldn't reach the feed, so showing saved issues");
      if (route.tab === "about") renderAbout();
    }
    manualRefresh = false;
  };
  window.onResumeApp = function () {
    if (Date.now() - lastAutoRefresh > 10 * 60 * 1000) doRefresh(false);
  };
  window.setDark = function (d) { document.body.classList.toggle("dark", !!d); };

  // ---------- boot ----------
  window.setDark(N.isDark());
  try { ui = Object.assign({ saved: {}, read: {}, open: {} }, JSON.parse(N.getState() || "{}")); } catch (e) {}
  loadArchive();
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (b) go(b.getAttribute("data-tab"));
  });
  document.getElementById("refreshBtn").addEventListener("click", function () { doRefresh(true); });
  window.addEventListener("scroll", function () {
    document.getElementById("topbar").classList.toggle("scrolled", window.scrollY > 4);
  }, { passive: true });
  render();
  doRefresh(false);
})();
</script>
</body>
</html>
